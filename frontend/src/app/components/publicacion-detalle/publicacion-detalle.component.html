<div class="detalle-container">

  <button class="btn-volver" (click)="volver()">⬅ Volver</button>

  <div *ngIf="cargandoPublicacion" class="loading">Cargando...</div>

  <div *ngIf="publicacion" class="publicacion-detalle">

    <div class="header">
      <img 
        class="avatar"
        [src]="publicacion.usuario?.imagenPerfil ? environment.uploads + 'perfiles/' + publicacion.usuario.imagenPerfil : 'assets/user.png'"
      />
      <div>
        <h3>{{ publicacion.titulo }}</h3>
        <p>@{{ publicacion.usuario.nombreUsuario }}</p>
      </div>
    </div>

    <p>{{ publicacion.mensaje }}</p>

    <img
      *ngIf="publicacion.imagen"
      class="img-detalle"
      [src]="environment.uploads + 'publicaciones/' + publicacion.imagen"
    />

    <button class="btn-like" (click)="toggleMeGusta()">
      ❤️ {{ publicacion.meGusta?.length || 0 }}
    </button>

  </div>

  <hr />

  <!-- COMENTARIOS -->
  <h4>Comentarios ({{ totalComentarios }})</h4>

  <div class="comentario" *ngFor="let c of comentarios">

    <img 
      class="avatar-small"
      [src]="c.usuario?.imagenPerfil ? environment.uploads + 'perfiles/' + c.usuario.imagenPerfil : 'assets/user.png'"
    />

    <div class="contenido">

      <strong>{{ c.usuario.nombre }} {{ c.usuario.apellido }}</strong>
      <p>{{ c.mensaje }}</p>

      <small>{{ c.createdAt | date:'short' }}</small>

    </div>

  </div>

</div>
